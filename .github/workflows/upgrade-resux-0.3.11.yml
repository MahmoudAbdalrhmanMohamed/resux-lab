name: Upgrade Resux dependency to 0.3.11

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/upgrade-resux-0.3.11.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install published Resux 0.3.11
        run: npm install resuxjs@0.3.11 --save

      - name: Verify exact published package
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./node_modules/resuxjs/package.json').version")" = "0.3.11"
          node -e "const lock=require('./package-lock.json'); const p=lock.packages['node_modules/resuxjs']; if (p.version !== '0.3.11' || !p.resolved.includes('registry.npmjs.org/resuxjs/-/resuxjs-0.3.11.tgz')) { console.error(p); process.exit(1) }"

      - name: Validate production build
        env:
          RESUX_HALAL_REPORT_SIGNING_SECRET: resux-lab-ci-only-release-validation-secret-0.3.11
        run: npm run build

      - name: Verify media prerender survived Resux build
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'routes: \["/media"\]' nitro.config.ts
          if grep -q 'routes: \[\]' nitro.config.ts; then
            echo 'Resux incorrectly erased the configured /media prerender route.'
            exit 1
          fi

      - name: Commit dependency update
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/upgrade-resux-0.3.11.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/upgrade-resux-0.3.11.yml
          git diff --cached --check
          git commit -m 'chore: upgrade resuxjs to 0.3.11'
          git push origin HEAD:main
