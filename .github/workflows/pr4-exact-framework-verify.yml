name: Verify PR 4 against exact Resux PR 36

on:
  push:
    branches:
      - agent/framework-i18n-runtime-regressions
    paths:
      - ".github/workflows/pr4-exact-framework-verify.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lab
        uses: actions/checkout@v4
        with:
          ref: agent/framework-i18n-runtime-regressions
          path: resux-lab
          persist-credentials: false

      - name: Checkout exact framework head
        uses: actions/checkout@v4
        with:
          repository: MahmoudAbdalrhmanMohamed/resux
          ref: a907bfd44db8c502497e8cb197bf2a672029c96c
          path: resux
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Build and test exact pair
        id: verify
        continue-on-error: true
        shell: bash
        env:
          RESUX_HALAL_REPORT_SIGNING_SECRET: ci-resux-lab-signing-secret-for-regression-validation-2026
        run: |
          set -euo pipefail
          cd resux
          npm ci --no-audit --no-fund
          npm run build
          npm pack --pack-destination /tmp

          cd ../resux-lab
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false /tmp/resuxjs-0.3.5.tgz
          npx playwright install --with-deps chromium
          npm run build
          npm run test:e2e
          npm run test:browser

      - name: Remove temporary verifier
        if: always()
        working-directory: resux-lab
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr4-exact-framework-verify.yml
          git commit -m "chore: remove PR 4 exact-framework verifier"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:agent/framework-i18n-runtime-regressions

      - name: Fail if verification failed
        if: ${{ steps.verify.outcome != 'success' }}
        run: exit 1
