name: Framework branch regression

on:
  push:
    branches:
      - agent/framework-i18n-runtime-regressions
    paths:
      - .github/workflows/framework-branch-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout lab
        uses: actions/checkout@v4
        with:
          path: resux-lab
      - name: Checkout Resux framework branch
        uses: actions/checkout@v4
        with:
          repository: MahmoudAbdalrhmanMohamed/resux
          ref: agent/i18n-router-runtime-hardening
          path: resux
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build and pack framework
        working-directory: resux
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
          npm pack --pack-destination ../resux-lab
      - name: Install lab with branch package
        working-directory: resux-lab
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save ./resuxjs-*.tgz
      - name: Build lab
        working-directory: resux-lab
        env:
          RESUX_HALAL_REPORT_SIGNING_SECRET: regression-only-signing-secret-0123456789abcdef
        run: |
          set +e
          npm run build > build.log 2>&1
          status=$?
          cat build.log
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 60 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Resux Lab build failed::$message"
            exit "$status"
          fi
      - name: Inspect generated localized routes and build ID
        working-directory: resux-lab
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'
          const manifest = JSON.parse(await readFile('.resux/manifest.json', 'utf8'))
          const paths = manifest.routes.map((route) => route.path)
          for (const required of ['/features/i18n', '/ar/features/i18n', '/media', '/ar/media']) {
            if (!paths.includes(required)) throw new Error(`Missing generated route ${required}`)
          }
          if (paths.includes('/en/features/i18n')) throw new Error('prefix_except_default generated duplicate /en route')
          const buildId = manifest.runtimeConfig?.runtimeConfig?.public?.__resuxBuildId
          if (!/^[a-f0-9]{24}$/.test(buildId || '')) throw new Error('Missing Resux build compatibility ID')
          console.log(JSON.stringify({ checkedRoutes: paths.length, buildId }))
          NODE
      - name: Run SSR/E2E regression suite
        working-directory: resux-lab
        run: npm run test:e2e
      - name: Install browser
        working-directory: resux-lab
        run: npx playwright install --with-deps chromium
      - name: Run browser regression suite
        working-directory: resux-lab
        run: npm run test:browser
