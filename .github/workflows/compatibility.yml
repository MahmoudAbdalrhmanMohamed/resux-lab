name: Resux compatibility lab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      resux_ref:
        description: Resux branch, tag, or commit to verify
        required: false
        default: main

permissions:
  contents: read

env:
  HALAL_REPORT_SECRET: resux-lab-ci-report-signing-secret-not-for-production
  RESUX_HALAL_REPORT_SECRET: resux-lab-ci-report-signing-secret-not-for-production
  RESUX_HALAL_REPORT_SIGNING_SECRET: resux-lab-ci-report-signing-secret-not-for-production

jobs:
  compatibility:
    name: Node ${{ matrix.node }} build and HTTP tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.19.0, 22]
    steps:
      - name: Checkout lab
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Prepare framework under test
        shell: bash
        env:
          RESUX_REF: ${{ github.event.inputs.resux_ref || 'main' }}
        run: |
          set -euo pipefail
          rm -rf ../resux
          git clone --filter=blob:none https://github.com/MahmoudAbdalrhmanMohamed/resux.git ../resux
          git -C ../resux fetch origin "${RESUX_REF}" --depth=1
          git -C ../resux checkout --detach FETCH_HEAD
          npm --prefix ../resux ci
          npm --prefix ../resux run build

          rm -f ../resux/resuxjs-*.tgz
          (cd ../resux && npm pack --pack-destination . >/dev/null)
          TARBALL_PATH="$(find ../resux -maxdepth 1 -type f -name 'resuxjs-*.tgz' -print -quit)"
          if [ -z "${TARBALL_PATH}" ]; then
            echo "No resuxjs tarball was produced by npm pack." >&2
            exit 1
          fi

          TARBALL_NAME="$(basename "${TARBALL_PATH}")"
          RESUX_DEP="file:../resux/${TARBALL_NAME}"

          RESUX_DEP="${RESUX_DEP}" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const packagePath = "package.json";
          const manifest = JSON.parse(readFileSync(packagePath, "utf8"));
          manifest.dependencies ??= {};
          manifest.dependencies.resuxjs = process.env.RESUX_DEP;
          writeFileSync(packagePath, `${JSON.stringify(manifest, null, 2)}\n`, "utf8");
          NODE

          # Refresh the dependency graph from the exact packed framework ref,
          # then let the following strict `npm ci` validate engines/integrity.
          npm_config_engine_strict=false npm install --package-lock-only --ignore-scripts

          RESUX_DEP="${RESUX_DEP}" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
          const framework = lock.packages?.["node_modules/resuxjs"];
          if (!framework || framework.resolved !== process.env.RESUX_DEP) {
            throw new Error(`Expected package-lock.json to resolve resuxjs from ${process.env.RESUX_DEP}.`);
          }
          NODE

      - name: Install lab strictly
        run: npm ci

      - name: Install Chromium for E2E tests
        run: npx playwright install --with-deps chromium

      - name: Build lab
        run: npm run build

      - name: Run server compatibility tests
        run: npm run test:e2e

  vercel-media:
    name: Vercel packaged generated-media gate (Node 22)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout lab
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Prepare framework under test
        shell: bash
        env:
          RESUX_REF: ${{ github.event.inputs.resux_ref || 'main' }}
        run: |
          set -euo pipefail
          rm -rf ../resux
          git clone --filter=blob:none https://github.com/MahmoudAbdalrhmanMohamed/resux.git ../resux
          git -C ../resux fetch origin "${RESUX_REF}" --depth=1
          git -C ../resux checkout --detach FETCH_HEAD
          npm --prefix ../resux ci
          npm --prefix ../resux run build

          rm -f ../resux/resuxjs-*.tgz
          (cd ../resux && npm pack --pack-destination . >/dev/null)
          TARBALL_PATH="$(find ../resux -maxdepth 1 -type f -name 'resuxjs-*.tgz' -print -quit)"
          if [ -z "${TARBALL_PATH}" ]; then
            echo "No resuxjs tarball was produced by npm pack." >&2
            exit 1
          fi

          TARBALL_NAME="$(basename "${TARBALL_PATH}")"
          RESUX_DEP="file:../resux/${TARBALL_NAME}"

          RESUX_DEP="${RESUX_DEP}" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const packagePath = "package.json";
          const manifest = JSON.parse(readFileSync(packagePath, "utf8"));
          manifest.dependencies ??= {};
          manifest.dependencies.resuxjs = process.env.RESUX_DEP;
          writeFileSync(packagePath, `${JSON.stringify(manifest, null, 2)}\n`, "utf8");
          NODE

          npm_config_engine_strict=false npm install --package-lock-only --ignore-scripts

          RESUX_DEP="${RESUX_DEP}" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
          const framework = lock.packages?.["node_modules/resuxjs"];
          if (!framework || framework.resolved !== process.env.RESUX_DEP) {
            throw new Error(`Expected package-lock.json to resolve resuxjs from ${process.env.RESUX_DEP}.`);
          }
          NODE

      - name: Install lab strictly
        run: npm ci

      - name: Build Vercel deployment artifact
        env:
          NITRO_PRESET: vercel
          VERCEL: "1"
          VERCEL_ENV: preview
        run: npm run build

      - name: Exercise packaged Vercel media handler
        env:
          VERCEL: "1"
          VERCEL_ENV: preview
        run: node --test tests/vercel-media.test.mjs

  published-package:
    name: Published resuxjs consumer gate (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lab
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked published dependency
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build lab with published resuxjs
        run: npm run build

      - name: Run published-package regressions
        run: npm run test:e2e

  browser:
    name: Node ${{ matrix.node }} Chromium UI and browser integrations
    runs-on: ubuntu-latest
    needs: compatibility
    strategy:
      fail-fast: false
      matrix:
        node: [20.19.0, 22]
    steps:
      - name: Checkout lab
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Prepare framework under test
        shell: bash
        env:
          RESUX_REF: ${{ github.event.inputs.resux_ref || 'main' }}
        run: |
          set -euo pipefail
          rm -rf ../resux
          git clone --filter=blob:none https://github.com/MahmoudAbdalrhmanMohamed/resux.git ../resux
          git -C ../resux fetch origin "${RESUX_REF}" --depth=1
          git -C ../resux checkout --detach FETCH_HEAD
          npm --prefix ../resux ci
          npm --prefix ../resux run build

          rm -f ../resux/resuxjs-*.tgz
          (cd ../resux && npm pack --pack-destination . >/dev/null)
          TARBALL_PATH="$(find ../resux -maxdepth 1 -type f -name 'resuxjs-*.tgz' -print -quit)"
          if [ -z "${TARBALL_PATH}" ]; then
            echo "No resuxjs tarball was produced by npm pack." >&2
            exit 1
          fi

          TARBALL_NAME="$(basename "${TARBALL_PATH}")"
          RESUX_DEP="file:../resux/${TARBALL_NAME}"

          RESUX_DEP="${RESUX_DEP}" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const packagePath = "package.json";
          const manifest = JSON.parse(readFileSync(packagePath, "utf8"));
          manifest.dependencies ??= {};
          manifest.dependencies.resuxjs = process.env.RESUX_DEP;
          writeFileSync(packagePath, `${JSON.stringify(manifest, null, 2)}\n`, "utf8");
          NODE

          npm_config_engine_strict=false npm install --package-lock-only --ignore-scripts

          RESUX_DEP="${RESUX_DEP}" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
          const framework = lock.packages?.["node_modules/resuxjs"];
          if (!framework || framework.resolved !== process.env.RESUX_DEP) {
            throw new Error(`Expected package-lock.json to resolve resuxjs from ${process.env.RESUX_DEP}.`);
          }
          NODE

      - name: Install lab strictly
        run: npm ci

      - name: Install Chromium
