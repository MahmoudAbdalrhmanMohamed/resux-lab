name: Optimize media QA payload

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/optimize-media-qa.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Reduce eager media fixture weight
        shell: python
        run: |
          from pathlib import Path

          file = Path("pages/media.vue")
          source = file.read_text(encoding="utf-8-sig")

          def replace_near(marker: str, old: str, new: str, window_size: int = 2200):
              global source
              start = source.find(marker)
              if start < 0:
                  raise SystemExit(f"Missing marker: {marker}")
              end = min(len(source), start + window_size)
              window = source[start:end]
              if old not in window:
                  raise SystemExit(f"Missing replacement near {marker}: {old}")
              window = window.replace(old, new, 1)
              source = source[:start] + window + source[end:]

          small_mp4 = '/media-test/videos/sample-360.mp4'

          replace_near('id: "video-eager-controls"', 'src: "/media-test/videos/sample-video.mp4"', f'src: "{small_mp4}"')
          replace_near('id: "advanced-hero-priority-preload"', 'src: "/media-test/videos/sample-video.mp4"', f'src: "{small_mp4}"')
          replace_near('id: "advanced-poster-first-ready"', 'src: "/media-test/videos/sample-1080.mp4"', f'src: "{small_mp4}"')
          replace_near('id: "advanced-hero-defer-chunk"', 'src: "/media-test/videos/sample-720.mp4"', f'src: "{small_mp4}"')

          replace_near('makeVideoCase("b1-eager-video"', 'src: videoAsset.mp4', 'src: videoAsset.q360')
          replace_near('makeVideoCase("b8-eager-preload-metadata"', 'src: videoAsset.mp4', 'src: videoAsset.q360')
          replace_near('makeVideoCase("b9-eager-preload-auto"', 'src: videoAsset.mp4', 'src: videoAsset.q360')
          replace_near('makeVideoCase("f1-multi-eager"', 'preload: "metadata"', 'preload: "none"')
          replace_near('makeVideoCase("g7-speed-eager"', 'src: videoAsset.mp4', 'src: videoAsset.q360')

          file.write_text(source, encoding="utf-8")

      - name: Validate production build
        env:
          RESUX_HALAL_REPORT_SIGNING_SECRET: resux-lab-ci-only-media-performance-validation-secret
        run: npm run build

      - name: Commit optimized media page
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/optimize-media-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/media.vue .github/workflows/optimize-media-qa.yml
          git diff --cached --check
          git commit -m 'perf(media): reduce initial eager video traffic'
          git push origin HEAD:main
