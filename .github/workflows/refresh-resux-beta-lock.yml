name: Refresh Resux beta lockfile

on:
  push:
    branches:
      - chore/update-resux-beta-4

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
      - name: Refresh lockfile for Resux beta.4
        run: npm install resuxjs@0.4.0-beta.4 --save-exact --package-lock-only --ignore-scripts
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh lockfile for Resux beta.4"
          git push
