name: Validate Node 20 consumer lock

on:
  push:
    branches:
      - fix/node20-consumer-visualizer

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/node20-consumer-visualizer

      - name: Setup Node 20.19
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Strict install
        run: npm ci --no-audit --no-fund

      - name: Build lab
        run: npm run build

      - name: Run server regressions
        run: npm run test:e2e

      - name: Commit regenerated lock and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/validate-node20-consumer-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/validate-node20-consumer-lock.yml
          git commit -m "fix: regenerate Node 20 consumer lock"
          git push origin HEAD:fix/node20-consumer-visualizer
