name: Update Resux beta lockfile

on:
  push:
    branches:
      - chore/resux-0.4.0-beta.3

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: chore/resux-0.4.0-beta.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Refresh lockfile for Resux beta.3
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact resuxjs@0.4.0-beta.3

      - name: Validate resolved version
        run: |
          node -e "const p=require('./package.json'); if(p.dependencies.resuxjs!=='0.4.0-beta.3') throw new Error('package.json not pinned to beta.3')"
          node -e "const l=require('./package-lock.json'); if(l.packages[''].dependencies.resuxjs!=='0.4.0-beta.3') throw new Error('lock root not pinned to beta.3'); if(l.packages['node_modules/resuxjs'].version!=='0.4.0-beta.3') throw new Error('resolved resuxjs is not beta.3')"

      - name: Remove helper and commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/update-resux-beta3-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/update-resux-beta3-lock.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh lockfile for resux 0.4.0-beta.3"
          git push origin HEAD:chore/resux-0.4.0-beta.3
