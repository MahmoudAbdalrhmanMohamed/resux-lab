name: Cleanup audit artifacts

on:
  push:
    branches:
      - audit/comprehensive-verification-20260807
    paths:
      - .github/workflows/cleanup-audit-artifacts.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/comprehensive-verification-20260807
      - name: Remove committed generated and accidental project files
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .nitro .resux-nitro 3403
          git rm .github/workflows/cleanup-audit-artifacts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(lab): remove generated and accidental artifacts"
          git push origin HEAD:audit/comprehensive-verification-20260807
