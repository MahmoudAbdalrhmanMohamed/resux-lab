name: Apply media eager regression fix

on:
  push:
    branches:
      - fix/media-regressions-0.3.10

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/media-regressions-0.3.10
          persist-credentials: true
      - name: Patch media matrix and regression coverage
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          page_path = Path('pages/media.vue')
          page = page_path.read_text(encoding='utf-8')

          replacements = [
              (
                  '    alt: "Eager PNG image",\n        lazy: true,\n    loading: "lazy",\n    \n    placeholder: none,',
                  '    alt: "Eager PNG image",\n    lazy: false,\n    loading: "eager",\n    placeholder: none,',
              ),
              (
                  '    preload: "metadata",\n        lazy: true,\n    loading: "lazy",\n    \n    poster: "/media-test/videos/sample-poster.jpg",',
                  '    preload: "metadata",\n    lazy: false,\n    loading: "eager",\n    poster: "/media-test/videos/sample-poster.jpg",',
              ),
              (
                  '          v-for="entry in imgCases"\n          :key="entry.id"\n          class="min-w-0 overflow-hidden rounded-3xl border border-white/10 bg-slate-950/65 p-3 sm:p-4"',
                  '          v-for="entry in imgCases"\n          :key="entry.id"\n          :data-media-case="entry.id"\n          class="min-w-0 overflow-hidden rounded-3xl border border-white/10 bg-slate-950/65 p-3 sm:p-4"',
              ),
              (
                  '          v-for="entry in videoCases"\n          :key="entry.id"\n          class="min-w-0 overflow-hidden rounded-3xl border border-white/10 bg-slate-950/65 p-3 sm:p-4"',
                  '          v-for="entry in videoCases"\n          :key="entry.id"\n          :data-media-case="entry.id"\n          class="min-w-0 overflow-hidden rounded-3xl border border-white/10 bg-slate-950/65 p-3 sm:p-4"',
              ),
          ]
          for old, new in replacements:
              if page.count(old) != 1:
                  raise SystemExit(f'Expected exactly one media.vue match, got {page.count(old)} for: {old[:80]}')
              page = page.replace(old, new, 1)
          page_path.write_text(page, encoding='utf-8')

          test_path = Path('tests/media-pages.e2e.test.mjs')
          tests = test_path.read_text(encoding='utf-8')
          anchor = 'test("video page renders one hero video with 3 click zones and control markers", async () => {'
          if tests.count(anchor) != 1:
              raise SystemExit(f'Expected exactly one test insertion anchor, got {tests.count(anchor)}')
          regression = '''function getMediaCaseMarkup(html, id) {\n  const marker = `data-media-case="${id}"`;\n  const markerIndex = html.indexOf(marker);\n  assert.notEqual(markerIndex, -1, `Missing media case ${id}`);\n  const articleStart = html.lastIndexOf("<article", markerIndex);\n  const articleEnd = html.indexOf("</article>", markerIndex);\n  assert.notEqual(articleStart, -1, `Missing article start for ${id}`);\n  assert.notEqual(articleEnd, -1, `Missing article end for ${id}`);\n  return html.slice(articleStart, articleEnd + "</article>".length);\n}\n\ntest("media matrix keeps labeled eager image and video cases eager", async () => {\n  const html = await fetchHtml("/media");\n\n  const eagerImage = getMediaCaseMarkup(html, "img-eager-no-placeholder");\n  assert.match(eagerImage, /<img\\b[^>]*\\bloading="eager"/i);\n  assert.doesNotMatch(eagerImage, /data-rx-lazy-image="true"/i);\n\n  const eagerVideo = getMediaCaseMarkup(html, "video-eager-controls");\n  assert.match(eagerVideo, /<video\\b/i);\n  assert.match(eagerVideo, /\\bpreload="metadata"/i);\n  assert.doesNotMatch(eagerVideo, /data-rx-lazy-video="true"/i);\n});\n\n'''
          tests = tests.replace(anchor, regression + anchor, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Commit clean final-tree fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-media-eager-regression-fix.yml
          git add pages/media.vue tests/media-pages.e2e.test.mjs
          git commit -m 'fix(media): align eager cases with labels'
          git push origin HEAD:fix/media-regressions-0.3.10
