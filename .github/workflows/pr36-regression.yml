name: PR 36 regression

on:
  push:
    branches: [agent/framework-i18n-runtime-regressions]
    paths:
      - .github/workflows/pr36-regression.yml

permissions:
  contents: read

env:
  RESUX_HALAL_REPORT_SIGNING_SECRET: regression-only-signing-secret-0123456789abcdef
  RESUX_HALAL_REPORT_SECRET: regression-only-signing-secret-0123456789abcdef
  HALAL_REPORT_SECRET: regression-only-signing-secret-0123456789abcdef

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lab
        uses: actions/checkout@v4
        with:
          path: resux-lab
          persist-credentials: false
      - name: Checkout reviewed framework follow-up
        uses: actions/checkout@v4
        with:
          repository: MahmoudAbdalrhmanMohamed/resux
          ref: ea2f29efc102225ffb5f70fcb4629427de7f1186
          path: resux
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Build and pack framework
        working-directory: resux
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
          npm pack --pack-destination ../resux-lab
      - name: Install lab with follow-up package
        working-directory: resux-lab
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save ./resuxjs-*.tgz
      - name: Build lab
        working-directory: resux-lab
        run: npm run build
      - name: Inspect generated routes and build ID
        working-directory: resux-lab
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'
          const manifest = JSON.parse(await readFile('.resux/manifest.json', 'utf8'))
          const paths = manifest.routes.map((route) => route.path)
          for (const required of ['/features/i18n', '/ar/features/i18n', '/media', '/ar/media']) {
            if (!paths.includes(required)) throw new Error(`Missing generated route ${required}`)
          }
          if (paths.includes('/en/features/i18n')) throw new Error('prefix_except_default generated duplicate /en route')
          const buildId = manifest.runtimeConfig?.runtimeConfig?.public?.__resuxBuildId
          if (!/^[a-f0-9]{24}$/.test(buildId || '')) throw new Error('Missing Resux build compatibility ID')
          console.log(JSON.stringify({ checkedRoutes: paths.length, buildId }))
          NODE
      - name: Install Chromium
        working-directory: resux-lab
        run: npx playwright install --with-deps chromium
      - name: Run SSR and HTTP regressions
        working-directory: resux-lab
        run: npm run test:e2e
      - name: Run browser regressions
        working-directory: resux-lab
        run: npm run test:browser
